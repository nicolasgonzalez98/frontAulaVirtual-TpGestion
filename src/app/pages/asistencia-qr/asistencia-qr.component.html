<div class="flex flex-col items-center mt-10 space-y-6">
  <h2 class="text-2xl font-semibold text-gray-700">
    QR de Asistencia
  </h2>

  <p class="text-gray-500">
    Escaneá este código para registrar tu asistencia a la clase.
  </p>

  <!-- Selector -->
  <div class="flex items-center space-x-4 mt-4">
    <button 
      (click)="setQrGeo('geo')" 
      class="px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600 transition">
      QR Impreso (valida ubicación)
    </button>

    <button 
      (click)="setQrGeo('noGeo')" 
      class="px-3 py-1 bg-gray-300 text-gray-700 rounded hover:bg-gray-400 transition">
      QR en pantalla (sin ubicación)
    </button>
  </div>

  <!-- QR -->
  <div class="flex justify-center mt-8">
    <qrcode [qrdata]="qrData" [width]="400" [errorCorrectionLevel]="'M'"></qrcode>
  </div>

  <p class="text-sm text-gray-400 mt-4">
    ID de clase: {{ idClase }}
  </p>

  <!-- 🔗 Enlace sutil para pruebas -->
  <a 
    [href]="qrData" 
    target="_blank" 
    class="text-xs text-gray-300 hover:text-gray-500 transition-colors duration-200 underline"
  >
    Abrir enlace de asistencia
  </a>

  <!-- Botón imprimir -->
  <button 
    (click)="printQR()" 
    class="mt-6 px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition">
    🖨️ Imprimir QR
  </button>
</div>
