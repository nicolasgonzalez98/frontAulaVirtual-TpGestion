<div class="container mx-auto p-6">
  <p-toast></p-toast>
  <p-confirmDialog></p-confirmDialog>

  <div class="mb-6 flex justify-between items-center">
    <h1 class="text-4xl font-bold text-gray-800">Administración de Usuarios</h1>
    <p-button 
      label="Nuevo Usuario" 
      icon="pi pi-plus" 
      (onClick)="newUser()"
      severity="success">
    </p-button>
  </div>

  <div class="bg-white rounded-lg shadow-lg p-4">
    <p-table 
      [value]="users" 
      [loading]="loading"
      [paginator]="true"
      [rows]="10"
      [rowsPerPageOptions]="[5, 10, 20, 50]"
      [tableStyle]="{ 'min-width': '60rem' }"
      styleClass="p-datatable-striped"
      [globalFilterFields]="['nombre', 'apellido', 'email', 'dni', 'rol']">
      
      <ng-template pTemplate="caption">
        <div class="flex">
          <span class="p-input-icon-left ml-auto">
            <i class="pi pi-search"></i>
            <input 
              pInputText 
              type="text" 
              #globalFilter
              (input)="$any($event.target)?.value && users"
              placeholder="Buscar usuarios..." 
              class="w-full" />
          </span>
        </div>
      </ng-template>

      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="id" style="width: 5%">
            ID <p-sortIcon field="id"></p-sortIcon>
          </th>
          <th pSortableColumn="nombre" style="width: 20%">
            Nombre <p-sortIcon field="nombre"></p-sortIcon>
          </th>
          <th pSortableColumn="email" style="width: 20%">
            Email <p-sortIcon field="email"></p-sortIcon>
          </th>
          <th pSortableColumn="dni" style="width: 12%">
            DNI <p-sortIcon field="dni"></p-sortIcon>
          </th>
          <th pSortableColumn="rol" style="width: 13%">
            Rol <p-sortIcon field="rol"></p-sortIcon>
          </th>
          <th pSortableColumn="activo" style="width: 10%">
            Estado <p-sortIcon field="activo"></p-sortIcon>
          </th>
          <th style="width: 20%">Acciones</th>
        </tr>
      </ng-template>
      
      <ng-template pTemplate="body" let-user>
        <tr>
          <td>{{ user.id }}</td>
          <td class="font-semibold">{{ user.nombre }} {{ user.apellido }}</td>
          <td>
            <i class="pi pi-envelope mr-2 text-gray-500"></i>
            {{ user.email }}
          </td>
          <td>{{ user.dni }}</td>
          <td>
            <p-tag 
              [value]="user.rol" 
              [severity]="getRoleSeverity(user.rol)"
              [rounded]="true">
            </p-tag>
          </td>
          <td>
            <p-tag 
              [value]="user.activo ? 'Activo' : 'Inactivo'" 
              [severity]="getSeverity(user.activo)"
              [rounded]="true">
            </p-tag>
          </td>
          <td>
            <div class="flex gap-2">
              <p-button 
                icon="pi pi-pencil" 
                [rounded]="true"
                [text]="true"
                severity="info"
                (onClick)="editUser(user.id)"
                pTooltip="Editar usuario"
                tooltipPosition="top">
              </p-button>
              <p-button 
                [icon]="user.activo ? 'pi pi-ban' : 'pi pi-check'"
                [rounded]="true"
                [text]="true"
                severity="secondary"
                (onClick)="toggleStatus(user)"
                [pTooltip]="user.activo ? 'Desactivar usuario' : 'Activar usuario'"
                tooltipPosition="top"
                [styleClass]="user.activo ? 'text-orange-600' : 'text-green-600'">
              </p-button>
              <p-button 
                icon="pi pi-trash" 
                [rounded]="true"
                [text]="true"
                severity="danger"
                (onClick)="deleteUser(user)"
                pTooltip="Eliminar usuario"
                tooltipPosition="top">
              </p-button>
            </div>
          </td>
        </tr>
      </ng-template>
      
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="7" class="text-center py-8">
            <i class="pi pi-users text-4xl text-gray-400 mb-4"></i>
            <p class="text-gray-600 text-lg">No hay usuarios registrados</p>
          </td>
        </tr>
      </ng-template>
      
      <ng-template pTemplate="loadingbody">
        <tr>
          <td colspan="7" class="text-center py-8">
            <i class="pi pi-spin pi-spinner text-4xl text-blue-500"></i>
            <p class="text-gray-600 mt-4">Cargando usuarios...</p>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
